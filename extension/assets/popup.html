<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 300px;
            padding: 15px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1b26;
            color: #c0caf5;
        }
        h2 {
            margin-top: 0;
            color: #7aa2f7;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
        }
        input[type="password"] {
            width: 100%;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #414868;
            background-color: #24283b;
            color: white;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 4px;
            background-color: #7aa2f7;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #5d8eea;
        }
        .status {
            margin-top: 10px;
            font-size: 12px;
            text-align: center;
            min-height: 15px;
        }
        .success { color: #9ece6a; }
        .error { color: #f7768e; }
    </style>
</head>
<body>
    <h2>Akkurate</h2>
    <div class="form-group">
        <label for="apiKey">Gemini API Key</label>
        <input type="password" id="apiKey" placeholder="Enter API Key">
    </div>
    <button id="saveBtn">Save Settings</button>
    <div id="status" class="status"></div>

    <script src="popup.js"></script>
</body>
</html>
